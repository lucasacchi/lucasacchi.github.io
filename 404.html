<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Sign in | Luca Sacchi</title>
  <link rel="stylesheet" href="/auth/style.css">
  <script src="/auth/login.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Luca Sacchi</p>
    <h1 id="page-title">Welcome back.</h1>
    <p id="intro">Sign in to open your private website.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="lucasacchi31@gmail.com" autocomplete="username" readonly>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit" disabled>Sign in</button>
    </form>
    <div class="secondary-actions">
      <button type="button" id="toggle-mode">Set up my password</button>
      <button type="button" id="reset-password">Forgot password?</button>
    </div>
    <details id="email-link-help">
      <summary>Trouble opening an email link?</summary>
      <p>Paste the full link from your password or verification email to open it here.</p>
      <form id="email-link-form">
        <label for="email-action-link">Email link</label>
        <input id="email-action-link" type="url" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button id="open-email-link" type="submit">Open email link</button>
      </form>
    </details>
    <section id="verification" hidden>
      <p>Check your inbox and open the verification link. Then come back here.</p>
      <button type="button" id="check-verification">I’ve verified my email</button>
      <button type="button" id="resend-verification" class="text-button">Resend verification email</button>
    </section>
    <p id="status" role="status" aria-live="polite">Preparing secure sign-in…</p>
    <noscript><p>JavaScript is required to sign in and open this private website.</p></noscript>
  </main>
</body>
</html>
